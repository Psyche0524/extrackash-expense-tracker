{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f4">
  <script>
    // Apply the theme before the page paints so dark mode never flashes white.
    // shortcut: the choice is saved per device (localStorage), not per account; move to the user model if it should sync.
    (function () {
      var pick; try { pick = localStorage.getItem('theme'); } catch (e) {}
      var dark = pick === 'dark' || (pick !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name=theme-color]').content = dark ? '#0c1411' : '#f3f7f4';
    })();
  </script>
  <title>{% block title %}Extrackash{% endblock %}</title>
  <link rel="icon" href="{% static 'images/logo.png' %}">
  <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  {% include 'components/popups.html' %}
  <main class="screen">
    {% block content %}{% endblock %}
  </main>
  {% block tabbar %}{% include 'components/navbar.html' %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
